name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebKitGTK dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri

      - name: Generate desktop icons
        run: node scripts/generate-icons.mjs

      - name: Run cross-platform desktop readiness check
        run: node scripts/build-desktop.mjs --check

      - name: Verify Rust crate compilation
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib

      - name: Smoke test standalone CLI
        run: node cli/oake.mjs --help

      - name: Run JavaScript tests
        run: npm test
