name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Version tag to release, such as v0.2.0
        required: true
        type: string

permissions:
  contents: read

env:
  # Empty for a test build, which produces workflow artifacts but no release.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  draft-release:
    name: Prepare draft release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
      skip: ${{ steps.draft.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # One job creates the release so the three builds cannot each create their own.
      # A published release is never rebuilt: publishing a draft pushes its tag again.
      - name: Create or reuse the draft release
        id: draft
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/set-version.mjs --check "${RELEASE_TAG#v}"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | "\(.id) \(.draft)"')
          read -r id draft <<< "$existing" || true
          if [ "$draft" = "false" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG is already published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" -f name="OAKe $RELEASE_TAG" \
              -F draft=true -F generate_release_notes=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: draft-release
    if: needs.draft-release.outputs.skip != 'true'
    name: Build (${{ matrix.os_label }} / ${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # upload installers to the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os_label: macos
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            os_label: windows
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            os_label: linux
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux WebKitGTK dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri

      - name: Generate desktop icons and run readiness check
        run: |
          node scripts/generate-icons.mjs
          node scripts/build-desktop.mjs --check

      # Tauri treats an empty APPLE_* variable as "set" and fails trying to import
      # an empty certificate, so only export the secrets that actually exist.
      # Without them the app is ad-hoc signed (tauri.conf.json signingIdentity "-").
      - name: Export configured Apple signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s<<__OAKE_EOF__\n%s\n__OAKE_EOF__\n' "$name" "$value" >> "$GITHUB_ENV"
            fi
          done

      # Signed update packages need the private key. Without it, installers build as before.
      - name: Enable signed updates
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "No update signing key: this build offers no in-app update" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! node -e 'process.exit(require("./desktop/src-tauri/tauri.conf.json").plugins.updater.pubkey ? 0 : 1)'; then
            echo "::error::A signing key is set but plugins.updater.pubkey is empty"
            exit 1
          fi
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            printf '%s<<__OAKE_EOF__\n%s\n__OAKE_EOF__\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          node -e 'const fs = require("fs"), f = "desktop/src-tauri/tauri.conf.json", c = JSON.parse(fs.readFileSync(f)); c.bundle.createUpdaterArtifacts = true; fs.writeFileSync(f, JSON.stringify(c, null, 2))'

      - name: Build Tauri installers and upload to the draft release
        if: env.RELEASE_TAG != ''
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          releaseId: ${{ needs.draft-release.outputs.id }}
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }}

      - name: Build Tauri installers (test build)
        if: env.RELEASE_TAG == ''
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          args: --target ${{ matrix.target }}

      - name: Upload built installers as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os_label }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm

  provenance-attestation:
    name: Provenance Attestation (OAKe Self-Stamp)
    needs: [draft-release, build-desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # attach checksums and proof to the release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download built installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release-artifacts
          merge-multiple: true

      # The build action renames some files when uploading them, so a release is hashed
      # from its own assets. Test builds hash the workflow artifacts.
      - name: Compute SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft-release.outputs.id }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            rm -rf release-artifacts
            mkdir release-artifacts
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
              --jq '.[] | select(.name | test("[.](sig|oake[.]zip)$|^SHA256SUMS[.]txt$|^latest[.]json$") | not) | "\(.id) \(.name)"' > assets.txt
            test -s assets.txt
            while read -r id name; do
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "release-artifacts/$name"
            done < assets.txt
          fi
          cd release-artifacts
          # List flat names as GitHub Releases serves them (spaces become dots),
          # so `sha256sum -c SHA256SUMS.txt` works on downloaded assets.
          find . -type f ! -name 'SHA256SUMS.txt' | sort | while IFS= read -r file; do
            hash=$(sha256sum "$file" | cut -d ' ' -f 1)
            name=$(basename "$file" | tr ' ' '.')
            printf '%s  %s\n' "$hash" "$name"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Stamp SHA256SUMS.txt via OAKe (Certum EU + DigiCert US + OpenTimestamps Alice)
        run: |
          node cli/oake.mjs init
          node cli/oake.mjs capture release-artifacts/SHA256SUMS.txt --plain-paths --dir .
          ls -la .oake/proofs/

      - name: Upload SHA256SUMS.txt and OAKe provenance bundle as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: oake-release-provenance
          if-no-files-found: error
          include-hidden-files: true
          path: |
            release-artifacts/SHA256SUMS.txt
            .oake/proofs/*.oake.zip

      - name: Attach SHA256SUMS.txt and .oake.zip proof to GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-artifacts/SHA256SUMS.txt \
            .oake/proofs/*.oake.zip \
            --clobber

      - name: Publish the update manifest
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft-release.outputs.id }}
        run: |
          mkdir -p signatures
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' > signature-assets.txt
          if [ ! -s signature-assets.txt ]; then
            echo "No signed update packages; latest.json not published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "signatures/$name"
          done < signature-assets.txt
          node scripts/update-manifest.mjs "$GITHUB_REPOSITORY" "$RELEASE_TAG" signatures latest.json
          gh release upload "$RELEASE_TAG" latest.json --clobber

